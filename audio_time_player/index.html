<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 0; }
      audio { width: 100%; }
      #segmentControls {
        display: none;
        margin-top: 6px;
      }
      #segmentControls button {
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fff;
        padding: 5px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <audio id="player" controls></audio>
    <div id="segmentControls">
      <button id="replaySegment" type="button">Replay segment</button>
    </div>

    <script>
      const audio = document.getElementById("player");
      const segmentControls = document.getElementById("segmentControls");
      const replaySegment = document.getElementById("replaySegment");

      let timer = null;
      let pollMs = 250;
      let objectUrl = null;
      let activeStartSec = null;
      let activeEndSec = null;
      let lastSegmentToken = "";
      let reportTime = true;
      let emitEvents = true;
      let lastValueJson = "";
      let segmentEndedReported = false;

      function sendMessage(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type }, data || {}),
          "*"
        );
      }

      function setFrameHeight(h) {
        sendMessage("streamlit:setFrameHeight", { height: h });
      }

      function setValue(extra) {
        if (!emitEvents) return;
        const payload = Object.assign(
          {
            t: reportTime ? audio.currentTime || 0 : 0,
            needs_audio: !audio.src,   // key signal to Python
          },
          extra || {}
        );
        const payloadJson = JSON.stringify(payload);
        if (payloadJson === lastValueJson) return;
        lastValueJson = payloadJson;
        sendMessage("streamlit:setComponentValue", { value: payload });
      }

      function stopTimer() {
        if (timer) clearInterval(timer);
        timer = null;
      }

      function startTimer() {
        stopTimer();
        timer = setInterval(() => {
          if (activeStartSec !== null && audio.currentTime < activeStartSec) {
            audio.currentTime = activeStartSec;
          }
          if (activeEndSec !== null && audio.currentTime >= activeEndSec) {
            audio.pause();
            if (!segmentEndedReported) {
              segmentEndedReported = true;
              setValue({ segment_ended: true });
            }
            return;
          }
          if (reportTime && !audio.paused && !audio.ended) setValue();
        }, pollMs);
      }

      function prepareForPlay() {
        if (activeStartSec !== null && audio.currentTime < activeStartSec) {
          audio.currentTime = activeStartSec;
        }
        if (activeEndSec !== null && audio.currentTime >= activeEndSec - 0.05) {
          audio.currentTime = activeStartSec !== null ? activeStartSec : 0;
          segmentEndedReported = false;
        }
      }

      function restartSegment(play) {
        if (activeStartSec === null) return;
        audio.currentTime = activeStartSec;
        segmentEndedReported = false;
        if (play) audio.play().catch(() => setValue({ autoplay_blocked: true }));
      }

      function b64ToBlob(b64, mime) {
        // chunked decode to avoid stack/memory issues
        const sliceSize = 1024 * 1024; // 1MB chunks
        const byteChars = atob(b64);
        const byteArrays = [];
        for (let offset = 0; offset < byteChars.length; offset += sliceSize) {
          const slice = byteChars.slice(offset, offset + sliceSize);
          const bytes = new Uint8Array(slice.length);
          for (let i = 0; i < slice.length; i++) bytes[i] = slice.charCodeAt(i);
          byteArrays.push(bytes);
        }
        return new Blob(byteArrays, { type: mime || "audio/wav" });
      }

      audio.addEventListener("play", () => {
        prepareForPlay();
        startTimer();
      });
      audio.addEventListener("pause", stopTimer);
      audio.addEventListener("ended", stopTimer);
      audio.addEventListener("seeked", () => {
        if (reportTime) setValue();
      });
      audio.addEventListener("seeking", () => {
        if (activeStartSec !== null && audio.currentTime < activeStartSec) {
          audio.currentTime = activeStartSec;
        }
        if (activeEndSec !== null && audio.currentTime > activeEndSec) {
          audio.currentTime = activeStartSec !== null ? activeStartSec : activeEndSec;
        }
      });
      audio.addEventListener("loadedmetadata", () => setValue({ needs_audio: false }));
      audio.addEventListener("timeupdate", () => {
        if (activeStartSec !== null && audio.currentTime < activeStartSec) {
          audio.currentTime = activeStartSec;
          return;
        }
        if (activeEndSec !== null && audio.currentTime >= activeEndSec) {
          audio.pause();
          if (!segmentEndedReported) {
            segmentEndedReported = true;
            setValue({ segment_ended: true });
          }
          return;
        }
        if (reportTime && !audio.paused && !audio.ended) setValue();
      });
      audio.addEventListener("error", () => {
        const code = audio.error ? audio.error.code : null;
        setValue({ needs_audio: true, error: code });
      });
      replaySegment.addEventListener("click", () => restartSegment(true));

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") return;

        const args = data.args || {};
        pollMs = Number(args.poll_ms || 250);
        reportTime = args.report_time !== false;
        emitEvents = args.emit_events !== false;
        const h = Number(args.height || 90);
        activeStartSec =
          args.segment_token && Number.isFinite(Number(args.start_sec))
            ? Number(args.start_sec)
            : null;
        activeEndSec =
          args.end_sec === null || args.end_sec === undefined || args.end_sec === ""
            ? null
            : Number(args.end_sec);
        const startSec = Number(args.start_sec || 0);
        const segmentToken = String(args.segment_token || "");
        segmentControls.style.display = segmentToken ? "block" : "none";

        // If Python sends audio, load it via Blob URL (avoids huge data: URL issues)
        if (args.audio_b64 && args.audio_b64.length > 0) {
          const mime = args.mime || "audio/wav";
          try {
            const blob = b64ToBlob(args.audio_b64, mime);
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            objectUrl = URL.createObjectURL(blob);
            audio.src = objectUrl;
            audio.load();
            segmentEndedReported = false;
            setValue({ needs_audio: false });
          } catch (e) {
            setValue({ needs_audio: true, error: "decode_failed" });
          }
        } else {
          // If we have no src at all, request the audio again
          if (!audio.src) setValue({ needs_audio: true });
        }

        if (segmentToken && segmentToken !== lastSegmentToken) {
          lastSegmentToken = segmentToken;
          segmentEndedReported = false;
          const seekAndMaybePlay = () => {
            if (Number.isFinite(startSec)) audio.currentTime = Math.max(0, startSec);
            if (args.autoplay) {
              audio.play().catch(() => setValue({ autoplay_blocked: true }));
            }
            setValue({ segment_ended: false });
          };
          if (audio.readyState >= 1) {
            seekAndMaybePlay();
          } else {
            audio.addEventListener("loadedmetadata", seekAndMaybePlay, { once: true });
          }
        } else if (!segmentToken) {
          lastSegmentToken = "";
          segmentEndedReported = false;
        }

        setFrameHeight(h);
        if (!audio.paused && !audio.ended) startTimer();
      });

      // Critical: apiVersion must be 1
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight(90);
    </script>
  </body>
</html>
